name: Build Stockfish (BMI2)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Stockfish with x86-64-bmi2
    runs-on: ubuntu-latest
    env:
      COMPCXX: gcc
      COMP: gcc
      BINARY: x86-64-bmi2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install GCC 11 on Linux
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-gcc@v1.3
        with:
          version: 11

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++ git zip

      # --- FIX IS HERE ---
      - name: Download the neural network
        # Specify the working directory for this command
        working-directory: ./src
        run: make net

      - name: Check compiler version
        run: $COMPCXX -v

      # --- AND FIX IS HERE ---
      - name: Compile Stockfish with BMI2
        # Also run the main build from the 'src' directory
        # Move the compiled binary from 'src' up to the root directory
        working-directory: ./src
        run: |
          make clean
          make -j$(nproc) build ARCH=$BINARY COMP=$COMP
          make strip ARCH=$BINARY COMP=$COMP
          mv stockfish ../stockfish-ubuntu-x86-64-bmi2

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-ubuntu-x86-64-bmi2
          # The path is now correct as the binary was moved to the root
          path: ./stockfish-ubuntu-x86-64-bmi2
