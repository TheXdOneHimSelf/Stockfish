name: Build Stockfish

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Stockfish with x86-64-bmi2
    runs-on: ubuntu-latest
    env:
      COMPCXX: g++
      COMP: gcc
      BINARY: x86-64-bmi2
      CXXFLAGS: "-std=c++17"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install GCC 11 and G++ 11
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 110

      - name: Install dependencies
        run: |
          sudo apt-get install -y make git zip

      - name: Set compiler versions
        run: |
          gcc --version
          g++ --version

      - name: Download the neural network
        working-directory: ./src
        run: |
          make net

      - name: Compile Stockfish with BMI2
        working-directory: ./src
        run: |
          make clean
          make -j$(nproc) build ARCH=$BINARY COMP=$COMP COMPCXX=$COMPCXX
          make strip ARCH=$BINARY COMP=$COMP
          mv stockfish ../stockfish-ubuntu-x86-64-bmi2

      - name: Verify binary
        run: |
          chmod +x ./stockfish-ubuntu-x86-64-bmi2
          ./stockfish-ubuntu-x86-64-bmi2 --version

      - name: Create tar archive
        run: |
          tar -cf stockfish-ubuntu-x86-64-bmi2.tar stockfish-ubuntu-x86-64-bmi2
          ls -la *.tar

      - name: Upload compiled binary as tar
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-ubuntu-x86-64-bmi2
          path: ./stockfish-ubuntu-x86-64-bmi2.tar
