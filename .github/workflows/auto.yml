name: Sync stockfish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Add stockfish remote
        run: |
          git remote add stockfish https://github.com/official-stockfish/Stockfish.git || echo "Remote already exists"
          git fetch stockfish master  # Fetch Stockfish's master branch

      - name: Merge stockfish into our repo
        run: |
          git merge stockfish/master --allow-unrelated-histories -X ours --no-edit || echo "Merge completed"
          git add .
          git commit -m "Sync stockfish updates $(date +%Y-%m-%d)" || echo "No changes to commit"

      - name: Push changes
        run: git push origin master  # Push to master instead of main
