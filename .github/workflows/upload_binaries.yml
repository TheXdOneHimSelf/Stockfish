name: Build & Upload FireEngine BMI2

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.token }}
      BINARY_NAME: fireengine
      ARCH: x86-64-bmi2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make zip tar

      - name: Build FireEngine BMI2
        run: |
          make -C src -j$(nproc) ARCH=$ARCH COMP=g++ BINARY=$BINARY_NAME

      - name: Verify binary exists
        run: |
          if [ ! -f "src/$BINARY_NAME" ]; then
            echo "ERROR: Binary not found!"
            exit 1
          fi
          ls -lh src/$BINARY_NAME

      - name: Package binary
        run: |
          mkdir -p package
          cp src/$BINARY_NAME package/
          tar -cvf ${BINARY_NAME}-${ARCH}.tar -C package .

      - name: Create GitHub Release (dev)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: fireengine-bmi2-dev-${{ github.run_number }}
          name: FireEngine BMI2 Dev Build ${{ github.run_number }}
          files: fireengine-x86-64-bmi2.tar
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
