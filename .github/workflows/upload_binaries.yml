name: Upload Binaries

on:
  workflow_dispatch:

  workflow_call:
    secrets:
      token:
        required: true

jobs:
  Upload:
    name: Upload Linux Binary
    runs-on: ubuntu-latest
    env:
      COMPCXX: g++
      COMP: gcc
      EXT: ""
      NAME: linux
      BINARY: x86-64-bmi2
      SDE: none
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download compilation artifact
        uses: actions/download-artifact@v4
        with:
          name: linux x86-64-bmi2
          path: build

      - name: Prepare packaging directory
        run: |
          mkdir -p package/wiki
          cp -r build/src package/
          cp -r build/scripts package/
          cp build/stockfish-linux-x86-64-bmi2 package/
          cp build/Top\ CPU\ Contributors.txt package/
          cp build/{Copying.txt,AUTHORS,CITATION.cff,README.md,CONTRIBUTING.md} package/

      - name: Download wiki (optional)
        run: |
          git clone --depth 1 https://github.com/official-stockfish/Stockfish.wiki.git temp_wiki
          rm -rf temp_wiki/.git
          mv temp_wiki/* package/wiki/
        continue-on-error: true

      - name: Create archive
        run: |
          chmod +x ./package/stockfish-linux-x86-64-bmi2 || true
          tar -cvf stockfish-linux-x86-64-bmi2.tar -C package .

      - name: Capture commit info
        id: commit_info
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git show -s --date=format:'%Y%m%d' --format=%cd HEAD)" >> $GITHUB_ENV

      - name: Release (tag starts with sf_)
        if: startsWith(github.ref_name, 'sf_') && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: stockfish-linux-x86-64-bmi2.tar
          token: ${{ secrets.token }}

      - name: Check for upstream commits (only on master)
        if: github.ref_name == 'master'
        run: |
          git fetch
          echo "CHANGES=$(git rev-list HEAD..origin/master --count)" >> $GITHUB_ENV

      - name: Prerelease (only if up-to-date)
        if: github.ref_name == 'master' && env.CHANGES == '0'
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          name: Stockfish dev-${{ env.COMMIT_DATE }}-${{ env.COMMIT_SHA }}
          tag_name: stockfish-dev-${{ env.COMMIT_DATE }}-${{ env.COMMIT_SHA }}
          prerelease: true
          files: stockfish-linux-x86-64-bmi2.tar
          token: ${{ secrets.token }}
