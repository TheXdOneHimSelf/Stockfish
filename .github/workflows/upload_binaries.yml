name: Build and Upload FireEngine BMI2

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build FireEngine BMI2 on Ubuntu
    runs-on: ubuntu-latest
    env:
      NAME: fireengine
      BINARY: bmi2
      EXT: ""
    steps:
      # 1️⃣ Checkout your repo
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2️⃣ Set up dependencies (if needed)
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip tar

      # 3️⃣ Build the BMI2 binary
      - name: Build FireEngine BMI2
        run: |
          mkdir -p build
          # Replace this with your actual build command
          make build ARCH=bmi2
          # Move the binary to a known folder
          mv fireengine-bmi2 build/

      # 4️⃣ Prepare package folder
      - name: Prepare Package
        run: |
          mkdir -p fireengine-package
          cp build/fireengine-bmi2 fireengine-package/

      # 5️⃣ Create tar (for Linux)
      - name: Create tar
        run: |
          tar -cvf fireengine-bmi2.tar fireengine-package

      # 6️⃣ Upload artifact to GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fireengine-bmi2
          path: fireengine-bmi2.tar

      # 7️⃣ Release (optional, only if tagging)
      - name: Create GitHub Release
        if: startsWith(github.ref_name, 'v')
        uses: softprops/action-gh-release@v1
        with:
          files: fireengine-bmi2.tar
          token: ${{ secrets.token }}
