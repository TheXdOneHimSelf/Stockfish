name: Build & Upload FireEngine BMI2

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.token }}
      BINARY_NAME: fireengine
      ARCH: x86-64-bmi2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make zip tar

      - name: Build FireEngine BMI2
        run: |
          cd stockfish
          make -j$(nproc) ARCH=$ARCH COMP=g++ BINARY=$BINARY_NAME
          cd ..

      - name: Verify binary exists
        run: |
          ls -lh stockfish/$BINARY_NAME

      - name: Package binary
        run: |
          mkdir -p package
          cp stockfish/$BINARY_NAME package/
          tar -cvf $BINARY_NAME-$ARCH.tar -C package .

      - name: Create GitHub Release (dev)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.run_number }}-fireengine-bmi2
          name: FireEngine BMI2 Dev Build ${{ github.run_number }}
          files: fireengine-x86-64-bmi2.tar
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
