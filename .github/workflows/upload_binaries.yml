name: Build and Upload Fireengine

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      NAME: fireengine
      ARCH: x86-64-bmi2
      COMP: g++
      EXT: ""
      PAT_TOKEN: ${{ secrets.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential zip git

      - name: Build Fireengine
        run: |
          make -j$(nproc) build ARCH=$ARCH COMP=$COMP EXT=$EXT
          mv ./stockfish-$ARCH fireengine

      - name: Prepare package folder
        run: |
          mkdir fireengine-package
          cp fireengine fireengine-package/
          cp -r src scripts README.md AUTHORS COPYING.txt "Top CPU Contributors.txt" fireengine-package/ || true

      - name: Create tar package
        run: |
          tar -cvf fireengine-$ARCH.tar fireengine-package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: fireengine-dev
          name: Fireengine dev
          files: fireengine-$ARCH.tar
          token: ${{ secrets.token }}
