name: Upload Binaries

on:
  workflow_dispatch:

jobs:
  Artifacts:
    name: FireEngine BMI2
    runs-on: ubuntu-latest
    env:
      NAME: fireengine
      BINARY: bmi2
      EXT: # leave empty if no extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y make gcc g++ zip tar

      - name: Create package directory
        run: mkdir -p stockfish

      - name: Copy files
        run: |
          # Copy your compiled binary into stockfish directory
          cp path/to/fireengine-bmi2 ./stockfish/
          # Copy additional required files
          cp -r src scripts AUTHORS CITATION.cff README.md CONTRIBUTING.md "Top CPU Contributors.txt" Copying.txt ./stockfish/

      - name: Create tar (Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./stockfish/fireengine-bmi2
          tar -cvf fireengine-bmi2.tar stockfish

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        run: zip -r fireengine-bmi2.zip stockfish

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: fireengine-bmi2.tar # or .zip if Windows
          token: ${{ secrets.token }}
          tag_name: fireengine-bmi2
          name: fireengine-bmi2
          prerelease: false
